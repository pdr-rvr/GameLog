services:
  postgres:
    image: postgres:16-alpine
    container_name: gamelog-postgres
    environment:
      - POSTGRES_DB=gamelog
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=GameLog123!@#
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamelog"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - gamelog-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamelog-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_SERVER=postgres
      - DB_PORT=5432
      - DB_NAME=gamelog
      - DB_USER=postgres
      - DB_PASSWORD=GameLog123!@#
      - JWT_SECRET=GameLogSuperSecretKeyDefault1234567890!
    ports:
      - "7096:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gamelog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:7096
        - REACT_APP_API_BASE_URL=http://localhost:7096
    container_name: gamelog-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gamelog-network

volumes:
  postgres_data:

networks:
  gamelog-network:
    driver: bridge
