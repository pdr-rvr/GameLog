services:
  postgres:
    image: postgres:16-alpine
    container_name: gamelog-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-gamelog}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-***REDACTED_PASSWORD***}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gamelog}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - gamelog-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamelog-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - DB_SERVER=${DB_SERVER:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-gamelog}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-***REDACTED_PASSWORD***}
      - JWT_SECRET=${JWT_SECRET:-***REDACTED_JWT_SECRET***}
      - RAWG_API_KEY=${RAWG_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      - FORCE_RESEED=${FORCE_RESEED:-false}
    ports:
      - "7096:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gamelog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:7096
        - REACT_APP_API_BASE_URL=http://localhost:7096
    container_name: gamelog-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gamelog-network

volumes:
  postgres_data:

networks:
  gamelog-network:
    driver: bridge
