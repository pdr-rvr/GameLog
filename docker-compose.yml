services:
  postgres:
    image: postgres:16-alpine
    container_name: gamelog-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-gamelog}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Variavel de ambiente DB_PASSWORD obrigatoria no arquivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gamelog}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - gamelog-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamelog-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - DB_SERVER=${DB_SERVER:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-gamelog}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Variavel de ambiente DB_PASSWORD obrigatoria no arquivo .env}
      - JWT_SECRET=${JWT_SECRET:?Variavel de ambiente JWT_SECRET obrigatoria no arquivo .env}
      - RAWG_API_KEY=${RAWG_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      - FORCE_RESEED=${FORCE_RESEED:-false}
    ports:
      - "7096:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - gamelog-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:7096
        - REACT_APP_API_BASE_URL=http://localhost:7096
    container_name: gamelog-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gamelog-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M

volumes:
  postgres_data:

networks:
  gamelog-network:
    driver: bridge
