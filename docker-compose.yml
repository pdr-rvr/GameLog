services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gamelog-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=GameLog123!@#
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"GameLog123!@#\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"GameLog123!@#\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - gamelog-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamelog-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_SERVER=sqlserver,1433
      - DB_NAME=GameLog
      - DB_USER=sa
      - DB_PASSWORD=GameLog123!@#
      - JWT_SECRET=GameLogSuperSecretKeyDefault1234567890!
    ports:
      - "7096:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - gamelog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:7096
        - REACT_APP_API_BASE_URL=http://localhost:7096
    container_name: gamelog-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gamelog-network

volumes:
  sqlserver_data:

networks:
  gamelog-network:
    driver: bridge
