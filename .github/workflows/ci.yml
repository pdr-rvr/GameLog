name: GameLog CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (.NET 8 & Automated Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/GameLog_Backend.csproj

      - name: Build Backend (Release)
        run: dotnet build backend/GameLog_Backend.csproj --configuration Release --no-restore

      - name: Run Unit Tests (xUnit & Moq)
        run: dotnet test tests/GameLog.Tests.Unit/GameLog.Tests.Unit.csproj --configuration Release --verbosity normal

      - name: Run API Integration Tests (WebApplicationFactory)
        run: dotnet test tests/GameLog.Tests.Integration/GameLog.Tests.Integration.csproj --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend CI (Node 20, Vitest & Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Tests (Vitest & Testing Library)
        run: npm test

      - name: Build Frontend for Production
        run: npm run build

  docker-ci:
    name: Docker Compose Build Verification
    needs: [ backend-ci, frontend-ci ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all Docker images
        run: docker compose build
