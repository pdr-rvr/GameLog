name: GameLog CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (.NET 8.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore GameLog.sln

      - name: Build Solution (Release)
        run: dotnet build GameLog.sln --configuration Release --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test tests/GameLog.Tests.Unit/GameLog.Tests.Unit.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --no-build

      - name: Run Backend Integration Tests
        run: dotnet test tests/GameLog.Tests.Integration/GameLog.Tests.Integration.csproj --configuration Release --verbosity normal --no-build

  frontend-ci:
    name: Frontend CI (React / Vite / Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Frontend (Production Bundle)
        working-directory: ./frontend
        run: npm run build

  docker-verification:
    name: Container Security & Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gamelog-backend:ci-test

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gamelog-frontend:ci-test
