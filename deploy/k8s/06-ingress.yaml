apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamelog-ingress
  namespace: gamelog
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  tls:
    - hosts:
        - gamelog.app
        - www.gamelog.app
      secretName: gamelog-tls-cert
  rules:
    - host: gamelog.app
      http:
        paths:
          # Endpoints de API roteados diretamente para o backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gamelog-backend-service
                port:
                  number: 8080
          # Endpoints de Health Checks da API
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gamelog-backend-service
                port:
                  number: 8080
          # Roteamento SPA do Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gamelog-frontend-service
                port:
                  number: 80
