apiVersion: v1
kind: ConfigMap
metadata:
  name: gamelog-config
  namespace: gamelog
  labels:
    app.kubernetes.io/name: gamelog
    app.kubernetes.io/component: configuration
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  DB_SERVER: "gamelog-postgres-service"
  DB_PORT: "5432"
  DB_NAME: "gamelog"
  DB_USER: "gamelog_user"
  CORS_ALLOWED_ORIGINS: "https://gamelog.app,https://www.gamelog.app"
  FORCE_RESEED: "false"
  VITE_API_BASE_URL: "/api"
